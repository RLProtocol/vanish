[package]
name = "mock-swap"
version = "0.1.0"
description = "Test-only stand-in for the Jupiter aggregator (localnet tests of SolMix shielded swaps)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_swap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
